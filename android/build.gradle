group 'com.bumpbuy.tiktok_sdk'
version '1.0-SNAPSHOT'

buildscript {
repositories {
google()
mavenCentral()
}

dependencies {
classpath 'com.android.tools.build:gradle:8.1.0'
}
}

rootProject.allprojects {
repositories {
google()
mavenCentral()
}
}

apply plugin: 'com.android.library'

android {
namespace 'com.bumpbuy.tiktok_sdk'
compileSdk 35

defaultConfig {
minSdk 21
}
}
